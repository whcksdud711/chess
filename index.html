<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>체스 오프닝</title>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<style>
body { font-family: Arial, sans-serif; padding: 20px; }
button { padding: 2px 6px; font-size: 0.9em; margin-left: 3px; cursor: pointer; }
.toggle { margin-left: 20px; margin-top: 5px; }
.toggle-title { cursor: pointer; user-select: none; display: inline-block; }
.toggle-title::before {
  content: "▸";
  display: inline-block;
  margin-right: 6px;
  transition: transform 0.2s;
}
.toggle.open > .toggle-title::before { transform: rotate(90deg); }
.children { margin-left: 20px; }
.actions { display: inline-block; margin-left: 10px; }
.drop-target { background-color: #f0f0f0; border-radius: 5px; }
</style>
</head>
<body>
<h1>체스 오프닝</h1>
<button onclick="addRootToggle()">➕ 최상위 추가</button>
<div id="root"></div>

<script>
let data = JSON.parse(localStorage.getItem('toggleData')) || [
  { text: "1.e4 : 킹즈 폰 오프닝", children: [
      { text: "1...e5 : 오픈 게임", children: [
          { text: "2.Nf3 : 킹즈 나이트 오프닝", children: [] }
      ]}
  ]},
  { text: "1.d4 : 퀸즈 폰 오프닝", children: [] }
];

const rootDiv = document.getElementById('root');

function saveData() {
  localStorage.setItem('toggleData', JSON.stringify(data));
}

function render() {
  rootDiv.innerHTML = '';
  data.forEach((node, i) => rootDiv.appendChild(renderNode(node, [i])));
  applySortable();
}

function renderNode(node, path) {
  const div = document.createElement('div');
  div.className = 'toggle';

  const title = document.createElement('div');
  title.className = 'toggle-title';
  title.textContent = node.text;
  title.onclick = () => div.classList.toggle('open');

  const actions = document.createElement('span');
  actions.className = 'actions';

  const addBtn = document.createElement('button');
  addBtn.textContent = '➕';
  addBtn.title = '하위 토글 추가';
  addBtn.onclick = (e) => {
    e.stopPropagation();
    const newText = prompt('새 토글 내용을 입력하세요');
    if (newText) {
      let target = getNodeByPath(data, path);
      target.children.push({ text: newText, children: [] });
      saveData();
      render();
    }
  };

  const editBtn = document.createElement('button');
  editBtn.textContent = '✏️';
  editBtn.title = '수정';
  editBtn.onclick = (e) => {
    e.stopPropagation();
    const newText = prompt('새 내용으로 수정하세요', node.text);
    if (newText) {
      let target = getNodeByPath(data, path);
      target.text = newText;
      saveData();
      render();
    }
  };

  const delBtn = document.createElement('button');
  delBtn.textContent = '🗑️';
  delBtn.title = '삭제';
  delBtn.onclick = (e) => {
    e.stopPropagation();
    if (confirm('정말 삭제하시겠습니까?')) {
      removeNode(data, path);
      saveData();
      render();
    }
  };

  actions.appendChild(addBtn);
  actions.appendChild(editBtn);
  actions.appendChild(delBtn);
  title.appendChild(actions);
  div.appendChild(title);

  const childrenDiv = document.createElement('div');
  childrenDiv.className = 'children';
  node.children.forEach((child, j) => {
    childrenDiv.appendChild(renderNode(child, [...path, j]));
  });
  div.appendChild(childrenDiv);
  return div;
}

function getNodeByPath(arr, path) {
  return path.reduce((acc, cur) => acc.children ? acc.children[cur] : acc[cur], arr);
}

function removeNode(arr, path) {
  if (path.length === 1) {
    arr.splice(path[0], 1);
    return;
  }
  const parent = getNodeByPath(arr, path.slice(0, -1));
  parent.children.splice(path[path.length - 1], 1);
}

function addRootToggle() {
  const text = prompt('최상위 토글 내용을 입력하세요');
  if (text) {
    data.push({ text, children: [] });
    saveData();
    render();
  }
}

function getParentPathByElement(el) {
  const parents = [];
  let current = el.parentElement.closest('.children');
  while (current) {
    const index = Array.from(current.children).indexOf(el.closest('.toggle'));
    if (index >= 0) parents.unshift(index);
    current = current.parentElement.closest('.children');
  }
  return parents;
}

function applySortable() {
  document.querySelectorAll('.children').forEach((el) => {
    new Sortable(el, {
      animation: 150,
      group: 'nested',
      ghostClass: 'drop-target',
      onEnd: function(evt) {
        const parentPath = getParentPathByElement(el);
        const parent = getNodeByPath(data, parentPath);
        const moved = parent.children.splice(evt.oldIndex, 1)[0];
        parent.children.splice(evt.newIndex, 0, moved);
        saveData(); // render() 호출 X → 무제한 드래그 가능
      }
    });
  });
}

render();
</script>
</body>
</html>
