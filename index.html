<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>체스 오프닝 (백업/복원 기능 포함)</title>
  <style>
    body { 
      font-size: 40px; /* 기존보다 2배 */
      font-family: Arial, sans-serif; 
      padding: 40px; 
      background-color: rgb(144,144,144);
    }
    button {
      font-size: 0.75em;
      padding: 8px 8px;
      margin: 6px;
      cursor: pointer;
    }
    .toggle { margin-top: 10px; }
    .toggle-title {
      cursor: pointer;
      user-select: none;
      display: block;
      font-weight: bold;
    }
    .toggle-title::before {
      content: "▸";
      display: inline-block;
      margin-right: 12px;
      transition: transform 0.2s;
    }
    .toggle.open > .toggle-title::before { transform: rotate(90deg); }
    .children { margin-left: 20px; display: none; }
    .toggle.open > .children { display: block; }
    .actions { display: block; margin-left: 40px; }
    img.gif-image { max-width: 400px; display: none; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>체스 오프닝</h1>
  <button onclick="addRootToggle()">➕ 오프닝 추가</button>
  <button onclick="toggleAll()">전체 오프닝 열기/닫기</button>
  <button onclick="saveBackup()">💾 데이터 저장</button>
  <button onclick="loadBackup()">📂 데이터 불러오기</button>
  <input type="file" id="backupFile" accept=".json" style="display:none" onchange="handleFileLoad(event)">
  
  <div id="root"></div>

  <script>
    let data = JSON.parse(localStorage.getItem('toggleData')) || [
      { text: "1.e4 : 킹즈 폰 오프닝", gif: "", children: [
          { text: "1...e5 : 오픈 게임", gif: "", children: [
              { text: "2.Nf3 : 킹즈 나이트 오프닝", gif: "", children: [] }
          ]}
      ]}
    ];

    const rootDiv = document.getElementById('root');
    let openPaths = new Set(JSON.parse(localStorage.getItem('openPaths') || '[]'));
    let allOpen = false;
    let currentGifPath = null;

    function saveData() {
      localStorage.setItem('toggleData', JSON.stringify(data));
      localStorage.setItem('openPaths', JSON.stringify([...openPaths]));
    }

    function render() {
      rootDiv.innerHTML = '';
      data.forEach((node, i) => rootDiv.appendChild(renderNode(node, [i])));
    }

    function renderNode(node, path) {
      const div = document.createElement('div');
      div.className = 'toggle';
      const pathKey = path.join('-');
      if (openPaths.has(pathKey)) div.classList.add('open');
      div.dataset.path = pathKey;

      const title = document.createElement('div');
      title.className = 'toggle-title';
      title.textContent = node.text;
      title.style.color = path.length % 2 === 1 ? '#ffffff' : '#000000';

      title.onclick = (e) => {
        e.stopPropagation();
        document.querySelectorAll('.toggle').forEach(t => t.style.display = 'none');
        let visiblePath = '';
        path.forEach((p, i) => {
          visiblePath += (i > 0 ? '-' : '') + p;
          const el = document.querySelector(`[data-path="${visiblePath}"]`);
          if (el) el.style.display = 'block';
        });
        div.style.display = 'block';
        div.classList.toggle('open');
        if (div.classList.contains('open')) openPaths.add(pathKey);
        else openPaths.delete(pathKey);

        // 버튼/이미지 보이기
        document.querySelectorAll('.actions, .gif-image').forEach(e => e.style.display = 'none');
        const actions = div.querySelector('.actions');
        if (actions) actions.style.display = 'block';
        if (node.gif) {
          const img = div.querySelector('img.gif-image');
          if (img) img.style.display = 'block';
        }

        saveData();
      };

      const actions = document.createElement('div');
      actions.className = 'actions';
      actions.style.display = 'none';

      const addBtn = document.createElement('button');
      addBtn.textContent = '➕';
      addBtn.onclick = (e) => {
        e.stopPropagation();
        const newText = prompt('새 오프닝 이름을 입력하세요');
        if (newText) {
          getNodeByPath(data, path).children.push({ text: newText, gif: "", children: [] });
          render();
          saveData();
        }
      };

      const editBtn = document.createElement('button');
      editBtn.textContent = '✏️';
      editBtn.onclick = (e) => {
        e.stopPropagation();
        const newText = prompt('새 이름으로 수정하세요', node.text);
        if (newText) {
          node.text = newText;
          render();
          saveData();
        }
      };

      const delBtn = document.createElement('button');
      delBtn.textContent = '🗑️';
      delBtn.onclick = (e) => {
        e.stopPropagation();
        if (confirm('정말 삭제하시겠습니까?')) {
          getNodeByPath(data, path.slice(0, -1)).children.splice(path[path.length - 1], 1);
          render();
          saveData();
        }
      };

      const gifBtn = document.createElement('button');
      gifBtn.textContent = node.gif ? '❌ GIF 삭제' : '🖼️ GIF 추가';
      gifBtn.onclick = (e) => {
        e.stopPropagation();
        if (node.gif) {
          if (confirm('정말 삭제하시겠습니까?')) node.gif = "";
        } else {
          const url = prompt('GIF URL을 입력하세요');
          if (url) node.gif = url;
        }
        render();
        saveData();
      };

      actions.append(addBtn, editBtn, delBtn, gifBtn);
      div.append(title, actions);

      if (node.gif) {
        const img = document.createElement('img');
        img.src = node.gif;
        img.className = 'gif-image';
        img.style.display = 'none';
        div.appendChild(img);
      }

      const childrenDiv = document.createElement('div');
      childrenDiv.className = 'children';
      node.children.forEach((child, j) => childrenDiv.appendChild(renderNode(child, [...path, j])));
      div.appendChild(childrenDiv);

      return div;
    }

    function getNodeByPath(arr, path) {
      return path.reduce((acc, cur) => acc.children ? acc.children[cur] : acc[cur], arr);
    }

    function addRootToggle() {
      const text = prompt('오프닝 이름을 입력하세요');
      if (text) {
        data.push({ text, gif: "", children: [] });
        render();
        saveData();
      }
    }

    function toggleAll() {
      allOpen = !allOpen;
      openPaths.clear();
      function traverse(arr, path = []) {
        arr.forEach((node, i) => {
          const newPath = [...path, i];
          if (allOpen) openPaths.add(newPath.join('-'));
          traverse(node.children, newPath);
        });
      }
      traverse(data);
      render();
      saveData();
    }

    // 💾 데이터 저장
    function saveBackup() {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'chess_openings_backup.json';
      a.click();
    }

    // 📂 데이터 불러오기
    function loadBackup() {
      document.getElementById('backupFile').click();
    }

    function handleFileLoad(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          data = JSON.parse(e.target.result);
          saveData();
          render();
          alert('데이터가 성공적으로 불러와졌습니다!');
        } catch {
          alert('잘못된 JSON 파일입니다.');
        }
      };
      reader.readAsText(file);
    }

    render();
  </script>
</body>
</html>
