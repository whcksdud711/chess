<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>체스 오프닝 (드래그 가능 버전)</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    button { padding: 2px 6px; font-size: 0.85em; margin-left: 3px; }
    .toggle { margin-left: 20px; margin-top: 5px; }
    .toggle-title { cursor: pointer; user-select: none; display: inline-block; }
    .toggle-title::before {
      content: "▸";
      display: inline-block;
      margin-right: 6px;
      transition: transform 0.2s;
    }
    .toggle.open > .toggle-title::before { transform: rotate(90deg); }
    .children { margin-left: 20px; display: none; }
    .toggle.open > .children { display: block; }
    .actions { display: inline-block; margin-left: 10px; }
    .dragging { opacity: 0.5; }
    .drop-target { border: 1px dashed #999; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>체스 오프닝</h1>
  <button onclick="addRootToggle()">+ 최상위 추가</button>
  <div id="root"></div>

  <script>
    let data = JSON.parse(localStorage.getItem('toggleData')) || [
      {
        text: "1.e4 : 킹즈 폰 오프닝",
        children: [
          {
            text: "1...e5 : 오픈 게임",
            children: [
              { text: "2.Nf3 : 킹즈 나이트 오프닝", children: [] }
            ]
          }
        ]
      }
    ];

    const rootDiv = document.getElementById('root');
    let draggedPath = null;

    function saveData() {
      localStorage.setItem('toggleData', JSON.stringify(data));
    }

    function render() {
      rootDiv.innerHTML = '';
      data.forEach((node, i) => {
        rootDiv.appendChild(renderNode(node, [i]));
      });
    }

    function renderNode(node, path) {
      const div = document.createElement('div');
      div.className = 'toggle';
      div.draggable = true;

      const title = document.createElement('div');
      title.className = 'toggle-title';
      title.textContent = node.text;
      title.onclick = () => div.classList.toggle('open');

      // 드래그 이벤트
      div.addEventListener('dragstart', (e) => {
        draggedPath = path;
        div.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });

      div.addEventListener('dragend', () => {
        div.classList.remove('dragging');
        document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
      });

      div.addEventListener('dragover', (e) => {
        e.preventDefault();
        div.classList.add('drop-target');
      });

      div.addEventListener('dragleave', () => {
        div.classList.remove('drop-target');
      });

      div.addEventListener('drop', (e) => {
        e.preventDefault();
        div.classList.remove('drop-target');
        if (!draggedPath) return;

        const targetPath = path;
        if (targetPath.join() === draggedPath.join()) return;

        moveNode(data, draggedPath, targetPath);
        draggedPath = null;
        saveData();
        render();
      });

      // 액션 버튼
      const actions = document.createElement('span');
      actions.className = 'actions';

      const addBtn = document.createElement('button');
      addBtn.textContent = '+';
      addBtn.onclick = (e) => {
        e.stopPropagation();
        const newText = prompt('새 토글 내용을 입력하세요');
        if (newText) {
          const target = getNodeByPath(data, path);
          target.children.push({ text: newText, children: [] });
          saveData();
          render();
        }
      };

      const editBtn = document.createElement('button');
      editBtn.textContent = '✏️';
      editBtn.onclick = (e) => {
        e.stopPropagation();
        const newText = prompt('새 내용으로 수정하세요', node.text);
        if (newText) {
          const target = getNodeByPath(data, path);
          target.text = newText;
          saveData();
          render();
        }
      };

      const delBtn = document.createElement('button');
      delBtn.textContent = '🗑️';
      delBtn.onclick = (e) => {
        e.stopPropagation();
        if (confirm('정말 삭제하시겠습니까?')) {
          removeNode(data, path);
          saveData();
          render();
        }
      };

      actions.appendChild(addBtn);
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      title.appendChild(actions);
      div.appendChild(title);

      const childrenDiv = document.createElement('div');
      childrenDiv.className = 'children';
      node.children.forEach((child, j) => {
        childrenDiv.appendChild(renderNode(child, [...path, j]));
      });

      div.appendChild(childrenDiv);
      return div;
    }

    function getNodeByPath(arr, path) {
      return path.reduce((acc, cur) => acc.children ? acc.children[cur] : acc[cur], arr);
    }

    function removeNode(arr, path) {
      if (path.length === 1) {
        arr.splice(path[0], 1);
        return;
      }
      const parent = getNodeByPath(arr, path.slice(0, -1));
      parent.children.splice(path[path.length - 1], 1);
    }

    function moveNode(arr, fromPath, toPath) {
      const fromParent = fromPath.length === 1 ? arr : getNodeByPath(arr, fromPath.slice(0, -1)).children;
      const node = fromParent.splice(fromPath[fromPath.length - 1], 1)[0];

      const toParent = toPath.length === 1 ? arr : getNodeByPath(arr, toPath.slice(0, -1)).children;
      const targetIndex = toPath[toPath.length - 1];

      // 같은 부모일 때만 순서 변경
      if (fromParent === toParent) {
        toParent.splice(targetIndex, 0, node);
      }
    }

    function addRootToggle() {
      const text = prompt('최상위 토글 내용을 입력하세요');
      if (text) {
        data.push({ text, children: [] });
        saveData();
        render();
      }
    }

    render();
  </script>
</body>
</html>
