<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>체스 오프닝</title>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    details {
      margin-left: 20px;
      margin-top: 5px;
    }
    summary {
      cursor: pointer;
      display: inline-block;
      margin-right: 8px;
    }
    button {
      margin-left: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .add-btn {
      margin-top: 4px;
      font-size: 12px;
    }
    .children {
      margin-left: 20px;
    }
    .drop-target {
      background-color: #f0f0f0;
      border: 1px dashed #aaa;
    }
  </style>
</head>
<body>
  <h2>체스 오프닝</h2>
  <div id="root"></div>
  <button onclick="addNode(data)">+ 항목 추가</button>

  <script>
    let data = JSON.parse(localStorage.getItem('toggleData')) || [
      { text: '1.e4 : 킹즈 폰 오프닝', children: [
        { text: '1...e5 : 오픈 게임', children: [
          { text: '2.Nf3 : 킹즈 나이트 오프닝', children: [] }
        ]}
      ]},
      { text: '1.d4 : 퀸즈 폰 오프닝', children: [] }
    ];

    function saveData() {
      localStorage.setItem('toggleData', JSON.stringify(data));
    }

    function render() {
      const rootDiv = document.getElementById('root');
      rootDiv.innerHTML = '';
      data.forEach((node, i) => rootDiv.appendChild(createNode(node, [i])));
      applySortable();
    }

    function createNode(node, path) {
      const details = document.createElement('details');
      details.open = true;
      const summary = document.createElement('summary');
      const textSpan = document.createElement('span');
      textSpan.textContent = node.text;
      summary.appendChild(textSpan);

      const editBtn = document.createElement('button');
      editBtn.textContent = '수정';
      editBtn.onclick = (e) => {
        e.stopPropagation();
        const newText = prompt('수정할 내용을 입력하세요:', node.text);
        if (newText !== null) {
          node.text = newText;
          saveData();
          render();
        }
      };
      summary.appendChild(editBtn);

      const delBtn = document.createElement('button');
      delBtn.textContent = '삭제';
      delBtn.onclick = (e) => {
        e.stopPropagation();
        deleteNode(path);
      };
      summary.appendChild(delBtn);

      const addBtn = document.createElement('button');
      addBtn.textContent = '+';
      addBtn.className = 'add-btn';
      addBtn.onclick = (e) => {
        e.stopPropagation();
        addNode(getNodeByPath(data, path).children);
      };
      summary.appendChild(addBtn);

      details.appendChild(summary);

      const childrenDiv = document.createElement('div');
      childrenDiv.className = 'children';
      node.children.forEach((child, i) => {
        childrenDiv.appendChild(createNode(child, [...path, i]));
      });
      details.appendChild(childrenDiv);

      return details;
    }

    function addNode(target) {
      const text = prompt('추가할 내용을 입력하세요:');
      if (text) {
        target.push({ text, children: [] });
        saveData();
        render();
      }
    }

    function deleteNode(path) {
      if (!confirm('정말 삭제하시겠습니까?')) return;
      let target = data;
      for (let i = 0; i < path.length - 1; i++) {
        target = target[path[i]].children;
      }
      target.splice(path[path.length - 1], 1);
      saveData();
      render();
    }

    function getNodeByPath(obj, path) {
      return path.reduce((acc, idx) => acc.children ? acc.children[idx] : acc[idx], obj);
    }

    function getParentPathByElement(el) {
      const parents = [];
      let current = el.parentElement;
      while (current && !current.id.includes('root')) {
        const index = Array.from(current.parentElement.children).indexOf(current);
        if (index >= 0) parents.unshift(index);
        current = current.parentElement.closest('.children');
      }
      return parents;
    }

    function applySortable() {
      document.querySelectorAll('.children').forEach((el) => {
        new Sortable(el, {
          animation: 150,
          group: 'nested',
          ghostClass: 'drop-target',
          onEnd: function (evt) {
            const parentPath = getParentPathByElement(el);
            const parent = getNodeByPath(data, parentPath);
            const moved = parent.children.splice(evt.oldIndex, 1)[0];
            parent.children.splice(evt.newIndex, 0, moved);
            saveData(); // ✅ render() 호출 제거 (무제한 드래그 가능)
          }
        });
      });
    }

    render();
  </script>
</body>
</html>
