<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>체스 오프닝</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    textarea { width: 100%; height: 60px; margin-bottom: 10px; }
    button { padding: 5px 10px; margin-bottom: 20px; }
    .opening { margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
    .opening button { padding: 2px 6px; font-size: 0.9em; margin-left: 5px; }
  </style>
</head>
<body>
  <h1>체스 오프닝</h1>

  <h2>오프닝 추가/수정</h2>
  <textarea id="editor" placeholder="예: 1.c4 : 영어 오프닝"></textarea><br>
  <button onclick="saveOpening()">저장</button>

  <h2>오프닝 목록</h2>
  <div id="openings"></div>

  <script>
    let openings = JSON.parse(localStorage.getItem('chessOpenings')) || [
      "1.e4 : 킹즈 폰 오프닝",
      "1.d4 : 퀸즈 폰 오프닝"
    ];

    let editIndex = null; // 수정 중인 인덱스

    const openingsDiv = document.getElementById('openings');

    function renderOpenings() {
      openingsDiv.innerHTML = "";
      openings.forEach((line, index) => {
        const div = document.createElement('div');
        div.className = "opening";

        const span = document.createElement('span');
        span.textContent = line;

        const editBtn = document.createElement('button');
        editBtn.textContent = "수정";
        editBtn.onclick = () => editOpening(index);

        const delBtn = document.createElement('button');
        delBtn.textContent = "삭제";
        delBtn.onclick = () => removeOpening(index);

        div.appendChild(span);
        div.appendChild(editBtn);
        div.appendChild(delBtn);
        openingsDiv.appendChild(div);
      });
    }

    function saveOpening() {
      const text = document.getElementById('editor').value.trim();
      if(!text) return;

      if(editIndex !== null) {
        // 수정 중이면 기존 내용을 교체
        openings[editIndex] = text;
        editIndex = null;
      } else {
        // 새로 추가
        openings.push(text);
      }
      document.getElementById('editor').value = "";
      localStorage.setItem('chessOpenings', JSON.stringify(openings));
      renderOpenings();
    }

    function editOpening(index) {
      document.getElementById('editor').value = openings[index];
      editIndex = index;
    }

    function removeOpening(index) {
      openings.splice(index, 1);
      localStorage.setItem('chessOpenings', JSON.stringify(openings));
      renderOpenings();
    }

    renderOpenings();
  </script>
</body>
</html>
