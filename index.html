<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>체스 오프닝 (무한 토글)</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    button { padding: 2px 6px; font-size: 0.9em; margin-left: 5px; }
    .toggle {
      margin-left: 20px;
      margin-top: 5px;
    }
    .toggle-title {
      cursor: pointer;
      user-select: none;
      display: inline-block;
    }
    .toggle-title::before {
      content: "▸";
      display: inline-block;
      margin-right: 6px;
      transition: transform 0.2s;
    }
    .toggle.open > .toggle-title::before {
      transform: rotate(90deg);
    }
    .children {
      margin-left: 20px;
      display: none;
    }
    .toggle.open > .children {
      display: block;
    }
  </style>
</head>
<body>
  <h1>체스 오프닝</h1>
  <button onclick="addRootToggle()">+ 최상위 추가</button>
  <div id="root"></div>

  <script>
    let data = JSON.parse(localStorage.getItem('toggleData')) || [
      {
        text: "1.e4 : 킹즈 폰 오프닝",
        children: [
          {
            text: "1...e5 : 오픈 게임",
            children: [
              { text: "2.Nf3 : 킹즈 나이트 오프닝", children: [] }
            ]
          }
        ]
      }
    ];

    const rootDiv = document.getElementById('root');

    function saveData() {
      localStorage.setItem('toggleData', JSON.stringify(data));
    }

    function render() {
      rootDiv.innerHTML = '';
      data.forEach((node, i) => {
        rootDiv.appendChild(renderNode(node, [i]));
      });
    }

    function renderNode(node, path) {
      const div = document.createElement('div');
      div.className = 'toggle';
      const title = document.createElement('div');
      title.className = 'toggle-title';
      title.textContent = node.text;
      title.onclick = () => div.classList.toggle('open');

      const addBtn = document.createElement('button');
      addBtn.textContent = '+';
      addBtn.onclick = (e) => {
        e.stopPropagation();
        const newText = prompt('새 토글 내용을 입력하세요');
        if (newText) {
          let target = getNodeByPath(data, path);
          target.children.push({ text: newText, children: [] });
          saveData();
          render();
        }
      };

      title.appendChild(addBtn);
      div.appendChild(title);

      const childrenDiv = document.createElement('div');
      childrenDiv.className = 'children';
      node.children.forEach((child, j) => {
        childrenDiv.appendChild(renderNode(child, [...path, j]));
      });

      div.appendChild(childrenDiv);
      return div;
    }

    function getNodeByPath(arr, path) {
      return path.reduce((acc, cur) => acc.children ? acc.children[cur] : acc[cur], arr);
    }

    function addRootToggle() {
      const text = prompt('최상위 토글 내용을 입력하세요');
      if (text) {
        data.push({ text, children: [] });
        saveData();
        render();
      }
    }

    render();
  </script>
</body>
</html>
