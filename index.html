<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>체스 오프닝 (무한 토글, 상태 유지, 2px 들여쓰기)</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    button { padding: 2px 6px; font-size: 0.85em; margin-left: 3px; }
    .toggle { margin-top: 5px; }
    .toggle-title { cursor: pointer; user-select: none; display: inline-block; }
    .toggle-title::before {
      content: "▸";
      display: inline-block;
      margin-right: 6px;
      transition: transform 0.2s;
    }
    .toggle.open > .toggle-title::before { transform: rotate(90deg); }
    /* 하위 토글 들여쓰기 2px */
    .children { margin-left: 2px; display: none; }
    .toggle.open > .children { display: block; }
    .actions { display: inline-block; margin-left: 10px; }
  </style>
</head>
<body>
  <h1>체스 오프닝</h1>
  <button onclick="addRootToggle()">+ 최상위 추가</button>
  <div id="root"></div>

  <script>
    // 로컬스토리지에서 데이터 불러오기, 없으면 기본값
    let data = JSON.parse(localStorage.getItem('toggleData')) || [
      { text: "1.e4 : 킹즈 폰 오프닝", children: [
          { text: "1...e5 : 오픈 게임", children: [
              { text: "2.Nf3 : 킹즈 나이트 오프닝", children: [] }
          ]}
      ]}
    ];

    const rootDiv = document.getElementById('root');
    let openPaths = new Set();

    // 데이터 저장
    function saveData() {
      localStorage.setItem('toggleData', JSON.stringify(data));
    }

    function render() {
      rootDiv.innerHTML = '';
      data.forEach((node, i) => {
        rootDiv.appendChild(renderNode(node, [i]));
      });
    }

    function renderNode(node, path) {
      const div = document.createElement('div');
      div.className = 'toggle';

      const pathKey = path.join('-');
      if (openPaths.has(pathKey)) div.classList.add('open');

      const title = document.createElement('div');
      title.className = 'toggle-title';
      title.textContent = node.text;

      title.onclick = (e) => {
        e.stopPropagation();
        div.classList.toggle('open');
        if (div.classList.contains('open')) openPaths.add(pathKey);
        else openPaths.delete(pathKey);
      };

      const actions = document.createElement('span');
      actions.className = 'actions';

      // 하위 토글 추가
      const addBtn = document.createElement('button');
      addBtn.textContent = '+';
      addBtn.title = '하위 토글 추가';
      addBtn.onclick = (e) => {
        e.stopPropagation();
        const newText = prompt('새 토글 내용을 입력하세요');
        if (newText) {
          getNodeByPath(data, path).children.push({ text: newText, children: [] });
          saveData();  // 저장
          render();
        }
      };

      // 수정 버튼
      const editBtn = document.createElement('button');
      editBtn.textContent = '✏️';
      editBtn.title = '수정';
      editBtn.onclick = (e) => {
        e.stopPropagation();
        const newText = prompt('새 내용으로 수정하세요', node.text);
        if (newText) {
          getNodeByPath(data, path).text = newText;
          saveData();  // 저장
          render();
        }
      };

      // 삭제 버튼
      const delBtn = document.createElement('button');
      delBtn.textContent = '🗑️';
      delBtn.title = '삭제';
      delBtn.onclick = (e) => {
        e.stopPropagation();
        if (confirm('정말 삭제하시겠습니까?')) {
          getNodeByPath(data, path.slice(0, -1)).children.splice(path[path.length - 1], 1);
          openPaths.delete(pathKey);
          saveData();  // 저장
          render();
        }
      };

      actions.appendChild(addBtn);
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      title.appendChild(actions);
      div.appendChild(title);

      const childrenDiv = document.createElement('div');
      childrenDiv.className = 'children';
      node.children.forEach((child, j) => {
        childrenDiv.appendChild(renderNode(child, [...path, j]));
      });
      div.appendChild(childrenDiv);

      return div;
    }

    function getNodeByPath(arr, path) {
      return path.reduce((acc, cur) => acc.children ? acc.children[cur] : acc[cur], arr);
    }

    function addRootToggle() {
      const text = prompt('최상위 토글 내용을 입력하세요');
      if (text) {
        data.push({ text, children: [] });
        saveData();  // 저장
        render();
      }
    }

    render();
  </script>
</body>
</html>
